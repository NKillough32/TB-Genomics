name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Validate TB WGS pipeline fixture
        run: |
          python -m pip install snakemake==8.30.0
          snakemake \
            --snakefile pipelines/tb_wgs/Snakefile \
            --config outdir=validation/tb_wgs/observed \
            --cores 1 \
            --printshellcmds
          python scripts/validate_tb_wgs_outputs.py \
            --observed validation/tb_wgs/observed \
            --expected validation/tb_wgs/expected

      - name: Check Alembic migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          versions = Path("migrations/versions")
          required = [
              "0001_baseline.py",
              "0002_epidemiology_tables.py",
              "0003_case_pair_reviews.py",
              "0004_case_clinical_fields.py",
              "0005_entered_in_error_columns.py",
              "0006_add_performance_indexes.py",
              "0007_resistance_alerts_actions.py",
              "0008_case_data_mgmt.py",
              "0009_operational_indexes_trusts.py",
          ]
          missing = [name for name in required if not (versions / name).exists()]
          if missing:
              raise SystemExit(f"Missing migration files: {missing}")
          
          # Verify migration chain integrity
          text_0002 = (versions / "0002_epidemiology_tables.py").read_text()
          if 'down_revision: Union[str, Sequence[str], None] = "0001_baseline"' not in text_0002:
              raise SystemExit("0002_epidemiology_tables.py is not linked to 0001_baseline")
          
          # Verify epidemiology tables created
          for table in ["contacts", "locations", "exposures", "case_location_events", "case_contact_links"]:
              if f"CREATE TABLE IF NOT EXISTS {table}" not in text_0002:
                  raise SystemExit(f"0002_epidemiology_tables.py does not create {table}")
          
          # Verify each subsequent migration links to previous one
          migrations = [
              ("0003_case_pair_reviews.py", "0002_epidemiology_tables"),
              ("0004_case_clinical_fields.py", "0003_case_pair_reviews"),
              ("0005_entered_in_error_columns.py", "0004_case_clinical_fields"),
              ("0006_add_performance_indexes.py", "0005_entered_in_error_columns"),
              ("0007_resistance_alerts_actions.py", "0006_add_performance_indexes"),
              ("0008_case_data_mgmt.py", "0007_resistance_alerts_actions"),
              ("0009_operational_indexes_trusts.py", "0008_case_data_mgmt"),
          ]
          for migration_file, prev_migration in migrations:
              text = (versions / migration_file).read_text()
              if "down_revision:" not in text or f'"{prev_migration}"' not in text:
                  raise SystemExit(f"{migration_file} is not properly linked to {prev_migration}")

          text_0009 = (versions / "0009_operational_indexes_trusts.py").read_text()
          if "CREATE TABLE IF NOT EXISTS hsc_trusts" not in text_0009:
              raise SystemExit("0009_operational_indexes_trusts.py does not create hsc_trusts")
          
          PY

      - name: Lint changed hardening files
        run: |
          python -m ruff check \
            backend/models.py \
            tests/test_operational_hardening.py \
            tests/test_static_assets.py \
            migrations/versions/0009_operational_indexes_trusts.py

      - name: Compile Python sources
        run: python -m compileall backend scripts migrations
