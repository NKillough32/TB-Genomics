name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Check Alembic migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          versions = Path("migrations/versions")
          required = ["0001_baseline.py", "0002_epidemiology_tables.py"]
          missing = [name for name in required if not (versions / name).exists()]
          if missing:
              raise SystemExit(f"Missing migration files: {missing}")
          text = (versions / "0002_epidemiology_tables.py").read_text()
          if 'down_revision: Union[str, Sequence[str], None] = "0001_baseline"' not in text:
              raise SystemExit("0002_epidemiology_tables.py is not linked to 0001_baseline")
          for table in ["contacts", "locations", "exposures", "case_location_events", "case_contact_links"]:
              if f"CREATE TABLE IF NOT EXISTS {table}" not in text:
                  raise SystemExit(f"0002_epidemiology_tables.py does not create {table}")
          PY

      - name: Compile Python sources
        run: python -m compileall backend scripts migrations

