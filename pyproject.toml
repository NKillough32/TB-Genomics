[project]
name = "tb-genomics"
version = "0.6.0"
description = "TB genomic surveillance FastAPI platform with outbreak reporting workflows."
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "R_libs",
    "exports",
    "logs",
    "uploads",
    "mykrobe",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
]
